repos:
- repo: https://github.com/tofuutils/pre-commit-opentofu
  rev: v2.2.2
  hooks:
  - id: tofu_fmt
  - id: tofu_docs
  - id: tofu_tflint
  - id: tofu_validate
- repo: https://github.com/ansible/ansible-lint
  rev: v26.3.0
  hooks:
  - id: ansible-lint
    args: [.]
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.29.0
  hooks:
  - id: yamllint
    args: [-d, relaxed, .]
